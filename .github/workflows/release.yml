name: Release

# Push a tag like v1.2.0 to publish a signed APK on the GitHub Releases page.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MIDAS_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/midas-release.jks"

      - name: Build signed release APK
        env:
          MIDAS_KEYSTORE_FILE: ${{ runner.temp }}/midas-release.jks
          MIDAS_KEYSTORE_PASSWORD: ${{ secrets.MIDAS_KEYSTORE_PASSWORD }}
          MIDAS_KEY_ALIAS: ${{ secrets.MIDAS_KEY_ALIAS }}
          MIDAS_KEY_PASSWORD: ${{ secrets.MIDAS_KEY_PASSWORD }}
          MIDAS_VERSION_NAME: ${{ github.ref_name }}
          MIDAS_VERSION_CODE: ${{ github.run_number }}
        run: |
          export MIDAS_VERSION_NAME="${MIDAS_VERSION_NAME#v}"
          ./gradlew :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Midas-${{ github.ref_name }}.apk"
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)/apksigner verify dist/*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ### Install
            1. Download **Midas-${{ github.ref_name }}.apk** below on your Android phone (Android 8.0+).
            2. Open it and allow "Install unknown apps" for your browser or file manager when asked.
            3. Updates install over the old version and keep your data.
